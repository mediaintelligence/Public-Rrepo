server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index src/popup.html;

    # Health check endpoint for Cloud Run
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"boss-agent-extension","version":"1.0.0"}';
        add_header Content-Type application/json;
    }

    # Serve popup as the main page
    location = / {
        try_files /src/popup.html =404;
    }

    # Serve side panel
    location = /sidepanel {
        try_files /src/sidepanel.html =404;
    }

    # Serve options/settings page
    location = /settings {
        try_files /src/options.html =404;
    }

    # Serve CRE popup
    location = /cre {
        try_files /src/cre_popup/popup.html =404;
    }

    # Serve CRE side panel
    location = /cre/sidepanel {
        try_files /src/cre_sidepanel/sidepanel.html =404;
    }

    # Static assets
    location / {
        try_files $uri $uri/ =404;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
}
